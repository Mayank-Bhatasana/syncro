services:
  postgres:
    image: postgres:16-alpine
    container_name: syncro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncro
      POSTGRES_PASSWORD: syncro_password
      POSTGRES_DB: syncro_db
    ports:
      - "5433:5432"
    volumes:
      - syncro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncro -d syncro_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: syncro-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - syncro_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  syncro_pgdata:
  syncro_redisdata:
